<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A8BC2"/>
      <stop offset="1" stop-color="#1E3A66"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC94D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#FFC94D" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glyph" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B1F3D" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS grid: 824px tile, 100px margin, ~185px corner radius -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="3"/>
  <g fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 370 V320 a70 70 0 0 1 70 -70 H370"/>
    <path d="M654 250 H704 a70 70 0 0 1 70 70 V370"/>
    <path d="M774 654 V704 a70 70 0 0 1 -70 70 H654"/>
    <path d="M370 774 H320 a70 70 0 0 1 -70 -70 V654"/>
  </g>
  <text x="512" y="640" text-anchor="middle" font-family="Khmer MN" font-weight="bold" font-size="400" fill="#fff" filter="url(#glyph)">ក</text>
  <rect x="290" y="672" width="444" height="14" rx="7" fill="url(#scan)"/>
</svg>

name: Netra
options:
  bundleIdPrefix: com.netra
  deploymentTarget:
    macOS: "15.0"
settings:
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  SWIFT_VERSION: "5.0"
targets:
  Netra:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
      - path: Vendor/tesseract
        type: folder
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        NSScreenCaptureUsageDescription: "Netra needs to capture your screen to extract text from the region you select."
        NSMicrophoneUsageDescription: "Not used."
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    entitlements:
      path: Resources/Netra.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.camera: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netra.app
        PRODUCT_NAME: Netra
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
    dependencies: []

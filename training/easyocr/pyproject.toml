[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "khmer-ocr"
version = "0.1.0"
description = "Train & evaluate an EasyOCR-compatible text recognizer for Khmer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "datasets>=2.14",
    "huggingface_hub>=0.20",
    "pandas>=2.0",
    "pillow>=9.5",
    "numpy>=1.24",
    "lmdb>=1.4",
    "opencv-python-headless>=4.7",
    "natsort>=8.3",
    "nltk>=3.8",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "six>=1.16",
    "jiwer>=3.0",
]

[project.optional-dependencies]
# Optional: run inference through the official easyocr package after training.
# Installing this may change your torch version.
easyocr = ["easyocr>=1.7"]

[project.scripts]
khmer-ocr-prepare = "khmer_ocr.cli.prepare_data:main"
khmer-ocr-train = "khmer_ocr.cli.train:main"
khmer-ocr-eval = "khmer_ocr.cli.evaluate:main"
khmer-ocr-package = "khmer_ocr.cli.package_model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

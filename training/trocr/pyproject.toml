[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trocr-khmer"
version = "0.1.0"
description = "Fine-tune TrOCR for Khmer printed text OCR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=5.10,<6",
    "sentencepiece>=0.1.99",  # trocr-small-printed ships an XLM-RoBERTa SentencePiece tokenizer
    "datasets>=2.18.0",
    "evaluate>=0.4.0",
    "pillow>=10.0.0",
    "tensorboard>=2.14.0",
    "accelerate>=0.27.0",
    "fonttools>=4.40",  # glyph coverage checks for the synthetic renderer
]

[tool.setuptools.packages.find]
where = ["src"]
